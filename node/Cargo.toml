[package]
name = "hypersync-client-solana-node"
version = "0.2.0-rc.1"
edition = "2021"
rust-version = "1.77"
description = "Node.js bindings for the Solana HyperSync client"
license = "MPL-2.0"
repository = "https://github.com/enviodev/hypersync-client-solana"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.6.0", default-features = false, features = [
  "napi9",
  "async",
  "serde-json",
  "dyn-symbols",
] }
napi-derive = "3.4.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
arrow = { workspace = true, features = ["json"] }

hypersync-client-solana = { path = "../hypersync-client-solana" }
hypersync-solana-net-types = { path = "../hypersync-solana-net-types" }

[build-dependencies]
napi-build = "2.3.1"

name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run only (no upload to crates.io)'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    # `id-token: write` lets this job mint a GitHub OIDC token, which
    # rust-lang/crates-io-auth-action exchanges for a short-lived crates.io
    # API token. Each of the three crates has a Trusted Publisher entry on
    # crates.io pinning this repo + this workflow file.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-publish-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-publish-${{ runner.os }}-

      - name: Verify workspace builds
        run: cargo check --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace --no-fail-fast

      - name: Mint crates.io publish token
        uses: rust-lang/crates-io-auth-action@v1
        id: cratesio-auth

      # Publish in dependency order. After each upload, give the crates.io index
      # a few seconds to settle before the next publish tries to resolve it.
      - name: Publish hypersync-solana-schema
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio-auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${DRY_RUN:-false}" = "true" ]; then
            cargo publish -p hypersync-solana-schema --dry-run
          else
            cargo publish -p hypersync-solana-schema
            echo "Sleeping 30s for crates.io index to update..."
            sleep 30
          fi

      - name: Publish hypersync-solana-net-types
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio-auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${DRY_RUN:-false}" = "true" ]; then
            cargo publish -p hypersync-solana-net-types --dry-run
          else
            cargo publish -p hypersync-solana-net-types
            echo "Sleeping 30s for crates.io index to update..."
            sleep 30
          fi

      - name: Publish hypersync-client-solana
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio-auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${DRY_RUN:-false}" = "true" ]; then
            # Client depends on the two crates above; dry-run can't resolve
            # those if they aren't already on crates.io, so skip the client
            # check in dry-run mode.
            echo "Skipping client dry-run (transitive version constraint)."
          else
            cargo publish -p hypersync-client-solana
          fi

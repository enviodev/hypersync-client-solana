[package]
name = "hypersync-client-solana"
version = "0.0.8"
edition = "2021"
rust-version = "1.75"
description = "Rust client for Solana HyperSync"
license = "MPL-2.0"
repository = "https://github.com/enviodev/hypersync-client-solana"
homepage = "https://github.com/enviodev/hypersync-client-solana"
readme = "../README.md"
keywords = ["solana", "hypersync", "envio", "blockchain", "indexing"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
anyhow = "1"
arrow = { version = "57", features = ["ipc"] }
borsh = "1"
bs58 = "0.5"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["time", "sync", "rt"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }

hypersync-solana-net-types = { path = "../hypersync-solana-net-types", version = "0.0.8" }
hypersync-solana-schema = { path = "../hypersync-solana-schema", version = "0.0.8" }

[dev-dependencies]
borsh = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
